<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Map Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Static Map Generator</h1>
        <div class="controls">
            <div>
                <label for="center">Center Point (e.g., Tokyo Tower):</label>
                <input type="text" id="center" name="center" value="Tokyo Tower">
            </div>
            <div>
                <label for="width">Width (px): <span id="widthValue">600</span></label>
                <input type="range" id="width" name="width" min="100" max="1200" value="600">
            </div>
            <div>
                <label for="height">Height (px): <span id="heightValue">400</span></label>
                <input type="range" id="height" name="height" min="100" max="800" value="400">
            </div>
            <div>
                <label for="scale">Scale: <span id="scaleValue">1</span></label>
                <input type="range" id="scale" name="scale" min="1" max="4" value="1">
            </div>
            <div>
                <label for="geocodingApiKey">Geocoding API Key:</label>
                <input type="text" id="geocodingApiKey" name="geocodingApiKey">
            </div>
            <div>
                <label for="staticMapApiKey">Static Map API Key:</label>
                <input type="text" id="staticMapApiKey" name="staticMapApiKey">
            </div>
            <div>
                <label for="zoom">Zoom Level: <span id="zoomValue">14</span></label>
                <input type="range" id="zoom" name="zoom" min="1" max="20" value="14">
            </div>
            <button id="generateMap">Generate Map</button>
        </div>
        <div class="map-container">
            <img id="mapImage" src="" alt="Generated Map">
        </div>
        <button id="downloadMap" style="display:none;">Download Map</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
